{% extends "base.html" %}

{% block title %}源管理 - RSS监控{% endblock %}
{% block nav_sources %}active{% endblock %}

{% block extra_css %}
<style>
    .source-item {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .source-info {
        flex: 1;
    }
    
    .source-name {
        font-weight: 600;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    
    .source-url {
        font-size: 12px;
        color: #888;
        word-break: break-all;
        line-height: 1.4;
    }
    
    .source-meta {
        display: flex;
        gap: 20px;
        margin-top: 6px;
        font-size: 12px;
        color: #666;
        flex-wrap: wrap;
    }
    
    .source-actions {
        display: flex;
        gap: 6px;
        align-items: center;
    }
    
    .btn-icon {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: #e0e0e0;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s ease;
    }
    
    .btn-icon:hover {
        background: rgba(255,255,255,0.1);
    }
    
    .btn-icon.btn-edit:hover {
        border-color: #667eea;
        color: #667eea;
    }
    
    .btn-icon.btn-delete:hover {
        border-color: #f44336;
        color: #f44336;
    }
    
    .btn-icon.btn-check:hover {
        border-color: #4caf50;
        color: #4caf50;
    }
    
    .btn-icon.loading {
        opacity: 0.6;
        pointer-events: none;
    }
    
    .health-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        margin-left: 8px;
    }
    
    .health-badge.green {
        background: rgba(76, 175, 80, 0.15);
        color: #4caf50;
        border: 1px solid rgba(76, 175, 80, 0.3);
    }
    
    .health-badge.yellow {
        background: rgba(255, 152, 0, 0.15);
        color: #ff9800;
        border: 1px solid rgba(255, 152, 0, 0.3);
    }
    
    .health-badge.red {
        background: rgba(244, 67, 54, 0.15);
        color: #f44336;
        border: 1px solid rgba(244, 67, 54, 0.3);
    }
    
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .pagination button {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: #e0e0e0;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
    }
    
    .pagination button:hover:not(:disabled) {
        background: rgba(255,255,255,0.1);
        border-color: #667eea;
    }
    
    .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    
    .pagination .page-info {
        color: #888;
        font-size: 13px;
        margin: 0 8px;
    }
    
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.7);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .modal-content {
        background: #1a1a2e;
        border-radius: 20px;
        padding: 30px;
        width: 500px;
        max-width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        border: 1px solid rgba(255,255,255,0.1);
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #888;
    }
    
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.05);
        color: #fff;
        font-size: 14px;
        font-family: inherit;
    }
    
    .form-group textarea {
        min-height: 80px;
        resize: vertical;
    }
    
    .form-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 20px;
    }
    
    .hint {
        color: #888;
        font-size: 12px;
        margin-top: 5px;
    }
    
    @media (max-width: 768px) {
        .source-item {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
        }
        
        .source-info {
            width: 100%;
        }
        
        .source-actions {
            width: 100%;
            justify-content: flex-end;
        }
        
        .source-meta {
            gap: 12px;
        }
        
        .source-url {
            font-size: 11px;
        }
        
        .btn-icon {
            padding: 8px 12px;
            font-size: 14px;
        }
        
        .card-title {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        
        .card-title .btn {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>📡 我的 RSS 源</span>
        <button class="btn btn-primary" onclick="showAddSourceModal()">➕ 添加 RSS 源</button>
    </div>
    <div id="sourcesList">
        <div style="text-align: center; padding: 40px;">加载中...</div>
    </div>
    <div class="pagination" id="sourcesPagination"></div>
</div>

<div id="sourceModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 style="margin-bottom: 20px; color: #fff;" id="modalTitle">➕ 添加 RSS 源</h3>
        <form onsubmit="saveSource(event)">
            <input type="hidden" id="sourceId">
            <div class="form-group">
                <label>源名称</label>
                <input type="text" id="sourceName" placeholder="例如：NodeSeek全站" required>
            </div>
            <div class="form-group">
                <label>RSS URL</label>
                <input type="url" id="sourceUrl" placeholder="https://example.com/rss" required>
            </div>
            <div class="form-group">
                <label>检查间隔（秒）</label>
                <input type="number" id="sourceInterval" value="60" min="20" max="600" required>
            </div>
            <div class="form-group">
                <label>超时时间（秒）</label>
                <input type="number" id="sourceTimeout" value="30" min="10" max="120" required>
            </div>
            <div class="form-group">
                <label>User-Agent（可选）</label>
                <textarea id="sourceUA" placeholder="留空使用默认浏览器UA"></textarea>
                <div class="hint">💡 用于模拟浏览器访问，避免被屏蔽</div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn" onclick="hideSourceModal()" style="background: transparent; border: 1px solid rgba(255,255,255,0.2);">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<script>
let currentSources = [];
let currentPage = 1;
const pageSize = 10;
const DEFAULT_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';

async function loadSources(page = 1) {
    currentPage = page;
    try {
        const response = await fetch(`/api/sources?page=${page}&page_size=${pageSize}`);
        const data = await response.json();
        currentSources = data.sources;
        
        if (data.sources.length === 0) {
            document.getElementById('sourcesList').innerHTML = '<div style="text-align: center; padding: 40px;">暂无RSS源，请添加</div>';
            document.getElementById('sourcesPagination').innerHTML = '';
            return;
        }
        
        const html = data.sources.map(src => {
            const errors = src.consecutive_errors || 0;
            let healthClass = 'green';
            let healthText = '健康';
            if (errors >= 5) {
                healthClass = 'red';
                healthText = '异常';
            } else if (errors >= 3) {
                healthClass = 'yellow';
                healthText = '警告';
            }
            
            return `
            <div class="source-item">
                <div class="source-info">
                    <div class="source-name">
                        <span class="badge ${src.enabled ? 'badge-success' : 'badge-danger'}">${src.enabled ? '🟢' : '🔴'}</span>
                        ${src.name}
                        ${src.enabled ? `<span class="health-badge ${healthClass}">${healthText}${errors > 0 ? ' · '+errors+'次' : ''}</span>` : ''}
                    </div>
                    <div class="source-url">${src.url}</div>
                    <div class="source-meta">
                        <span>间隔: ${src.check_interval}s</span>
                        <span>超时: ${src.timeout || 30}s</span>
                        <span>上次: ${src.last_check ? src.last_check.substring(5, 16) : '从未'}</span>
                        <span>状态: ${src.last_status || '-'}</span>
                    </div>
                </div>
                <div class="source-actions">
                    <button class="btn-icon btn-check" onclick="checkSource(${src.id}, this)" title="检测">🔄</button>
                    <button class="btn-icon btn-edit" onclick="editSource(${src.id})" title="编辑">✏️</button>
                    <button class="btn-icon btn-delete" onclick="deleteSource(${src.id}, '${src.name}')" title="删除">🗑️</button>
                    <label class="switch">
                        <input type="checkbox" ${src.enabled ? 'checked' : ''} onchange="toggleSource(${src.id}, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        `}).join('');
        
        document.getElementById('sourcesList').innerHTML = html;
        renderPagination(data.page, data.total_pages);
    } catch (error) {
        console.error('加载源失败:', error);
    }
}

function renderPagination(currentPage, totalPages) {
    const container = document.getElementById('sourcesPagination');
    if (totalPages <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let html = '<button onclick="goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>◀◀</button>';
    html += '<button onclick="goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>◀</button>';
    
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        html += '<button onclick="goToPage(' + i + ')" style="' + (i === currentPage ? 'background:#667eea;color:#fff;' : '') + '">' + i + '</button>';
    }
    
    html += '<button onclick="goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>▶</button>';
    html += '<button onclick="goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>▶▶</button>';
    html += '<span class="page-info">' + currentPage + '/' + totalPages + '</span>';
    
    container.innerHTML = html;
    window.goToPage = function(page) {
        loadSources(page);
    };
}

function showAddSourceModal() {
    document.getElementById('modalTitle').textContent = '➕ 添加 RSS 源';
    document.getElementById('sourceId').value = '';
    document.getElementById('sourceName').value = '';
    document.getElementById('sourceUrl').value = '';
    document.getElementById('sourceInterval').value = '60';
    document.getElementById('sourceTimeout').value = '30';
    document.getElementById('sourceUA').value = '';
    document.getElementById('sourceModal').style.display = 'flex';
}

function editSource(id) {
    const source = currentSources.find(s => s.id === id);
    if (!source) return;
    
    document.getElementById('modalTitle').textContent = '✏️ 编辑 RSS 源';
    document.getElementById('sourceId').value = source.id;
    document.getElementById('sourceName').value = source.name;
    document.getElementById('sourceUrl').value = source.url;
    document.getElementById('sourceInterval').value = source.check_interval || 60;
    document.getElementById('sourceTimeout').value = source.timeout || 30;
    document.getElementById('sourceUA').value = (source.user_agent === DEFAULT_UA || !source.user_agent) ? '' : source.user_agent;
    document.getElementById('sourceModal').style.display = 'flex';
}

function hideSourceModal() {
    document.getElementById('sourceModal').style.display = 'none';
}

async function saveSource(event) {
    event.preventDefault();
    
    const id = document.getElementById('sourceId').value;
    const name = document.getElementById('sourceName').value.trim();
    const url = document.getElementById('sourceUrl').value.trim();
    const interval = parseInt(document.getElementById('sourceInterval').value);
    const timeout = parseInt(document.getElementById('sourceTimeout').value);
    const user_agent = document.getElementById('sourceUA').value.trim();
    
    if (!name || !url) return;
    
    const data = { name, url, interval, timeout, user_agent };
    const method = id ? 'PUT' : 'POST';
    const endpoint = id ? `/api/sources/${id}` : '/api/sources';
    
    try {
        const response = await fetch(endpoint, {
            method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await response.json();
        
        if (result.success) {
            hideSourceModal();
            loadSources(1);
        } else {
            alert(result.error || '保存失败');
        }
    } catch (error) {
        console.error('保存失败:', error);
        alert('保存失败');
    }
}

async function deleteSource(id, name) {
    if (!confirm(`确定要删除 RSS 源 "${name}" 吗？`)) return;
    
    try {
        await fetch(`/api/sources/${id}`, {method: 'DELETE'});
        loadSources(currentPage);
    } catch (error) {
        console.error('删除失败:', error);
        alert('删除失败');
    }
}

async function toggleSource(id, enabled) {
    try {
        await fetch(`/api/sources/${id}/toggle`, {method: 'POST'});
        loadSources(currentPage);
    } catch (error) {
        console.error('切换失败:', error);
    }
}

async function checkSource(id, btn) {
    const originalText = btn.textContent;
    btn.textContent = '⏳';
    btn.classList.add('loading');
    
    try {
        const response = await fetch(`/api/sources/${id}/check`, {method: 'POST'});
        const result = await response.json();
        
        if (result.success) {
            alert(`✅ ${result.message}`);
        } else {
            alert(`❌ 检测失败: ${result.error}`);
        }
        
        loadSources(currentPage);
    } catch (error) {
        console.error('检测失败:', error);
        alert('❌ 检测失败: 网络错误');
    } finally {
        btn.textContent = originalText;
        btn.classList.remove('loading');
    }
}

loadSources();
</script>
{% endblock %}
